name: Workflow Hub -2 Windows QA (EXE only)
on:
  push:
    branches:
      - codex/consumer-v2-initial-20261024
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-exe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked requirements and PyInstaller
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Validate source and unit tests without external login
        run: |
          python -m compileall -q automation_hub desktop_app.py workflow_hub.py tests
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Source EXE entrypoint diagnostics
        run: python desktop_app.py --self-test
      - name: Build EXE with separate Hub -2 name
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name WorkflowAutomationHub2 --add-data "resources;resources" --collect-all googleapiclient --collect-all google_auth_oauthlib desktop_app.py
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "dist/WorkflowAutomationHub2.exe")) { throw "Hub -2 EXE was not produced" }
          $p = Start-Process -FilePath "./dist/WorkflowAutomationHub2.exe" -ArgumentList "--self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Hub -2 packaged self-test failed" }
          $sha = (Get-FileHash "dist/WorkflowAutomationHub2.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "QA_UNSIGNED Hub -2 EXE SHA256: $sha"
      - name: Install screenshot support (QA only)
        run: python -m pip install "Pillow>=11,<13"
      - name: Real Windows GUI smoke (mocked Google/Blogger)
        run: python qa_windows_gui.py --output gui-review-evidence
      - name: Upload offline Windows GUI evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: WorkflowAutomationHub2-GUI-QA-Evidence
          path: gui-review-evidence/**
          if-no-files-found: warn
      - name: Upload QA_UNSIGNED standalone EXE (never Store MSIX)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: WorkflowAutomationHub2-Windows-QA_UNSIGNED
          path: dist/WorkflowAutomationHub2.exe
          if-no-files-found: error
